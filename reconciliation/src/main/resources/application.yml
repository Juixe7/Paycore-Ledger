server:
  port: ${PORT:8084}

spring:
  application:
    name: reconciliation
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paycore}
    username: ${DB_USER:paycore}
    password: ${DB_PASSWORD:paycore}
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_reconciliation
    baseline-on-migrate: true
