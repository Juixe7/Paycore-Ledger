server:
  port: ${PORT:8083}

spring:
  application:
    name: read-model-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paycore}
    username: ${DB_USER:paycore}
    password: ${DB_PASSWORD:paycore}
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_read_model
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: read-model-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

paycore:
  readmodel:
    kafka-listener-enabled: ${PAYCORE_READMODEL_KAFKA_ENABLED:false}
