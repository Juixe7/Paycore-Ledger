name: PayCore CI — Ledger & Payment Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  proto-and-architecture-gate:
    name: Protobuf Compatibility & ArchUnit Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Protobuf Wire Contract Backward Compatibility
        run: ./gradlew :platform-common:checkProtoCompatibility :platform-common:test --no-daemon

      - name: Verify ArchUnit Ledger Encapsulation & Module Boundaries
        run: ./gradlew :payments-core:test --tests "com.paycore.payments.ArchitectureBoundaryTest" --no-daemon

  jvm-integration-and-torture-tests:
    name: JVM Integration, Concurrency Torture & Property Tests
    runs-on: ubuntu-latest
    needs: proto-and-architecture-gate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Execute Full Gradle Test Suite (Testcontainers PostgreSQL + Toxiproxy + jqwik)
        run: ./gradlew test --no-daemon

      - name: Upload JUnit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: '**/build/reports/tests/test/**'

  go-edge-gateway:
    name: Go Edge Gateway Security & Rate-Limiter Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go Gateway Tests
        working-directory: gateway
        run: go test -v -race ./...
